<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sneha ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff4e8b,#ffb6c1);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}
.box{
background:#fff;
padding:30px;
border-radius:20px;
text-align:center;
width:340px;
box-shadow:0 0 20px rgba(0,0,0,.3);
z-index:2;
}
input{
width:100%;
padding:12px;
margin:15px 0;
border-radius:10px;
border:1px solid #ccc;
}
button{
padding:12px 25px;
border:none;
border-radius:10px;
background:#ff4081;
color:#fff;
font-size:16px;
cursor:pointer;
}
button:hover{
background:#e91e63;
}
#surprise{
display:none;
animation:fade 1s;
}
@keyframes fade{
from{opacity:0;transform:scale(.8);}
to{opacity:1;transform:scale(1);}
}
.heart{
position:absolute;
color:#ff1744;
font-size:20px;
animation:float 6s linear infinite;
}
@keyframes float{
0%{transform:translateY(100vh);opacity:1;}
100%{transform:translateY(-100px);opacity:0;}
}
</style>
</head>

<body>

<div class="box" id="login">
<h2>🔒 Birthday Surprise</h2>
<p>Enter Password</p>
<input type="password" id="pass" placeholder="Password">
<button onclick="check()">Open 🎁</button>
<p id="msg" style="color:red;margin-top:10px;"></p>
</div>

<div class="box" id="surprise">
<h1>🎉 Happy Birthday Sneha 🎂</h1>
<h2>❤️ My Princess ❤️</h2>
<p style="margin:15px 0;">
May your smile always stay bright.<br>
I wish you endless happiness, success and love. 💖
</p>
<h2>🌹 I Love You Forever 🌹</h2>
</div>

<script>
function check(){
let p=document.getElementById("pass").value;
if(p==="Snehatik"){
document.getElementById("login").style.display="none";
document.getElementById("surprise").style.display="block";
}else{
document.getElementById("msg").innerHTML="❌ Wrong Password!";
}
}

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(20+Math.random()*20)+"px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},300);
</script>

</body>
</html>
